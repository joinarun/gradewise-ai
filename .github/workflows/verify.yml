name: Verify
on: [push, pull_request]

permissions:
  contents: read

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run contracts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @gradewise/web
      - run: npm run test:rules

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Android SDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK directory is unset}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  ios-contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: apps/ios/Scripts/test-core.sh
