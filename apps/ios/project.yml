name: GradeWise
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.3
targets:
  GradeWise:
    type: application
    platform: iOS
    sources:
      - path: GradeWise
      - path: ../../shared/prompts/instructions.json
        buildPhase: resources
      - path: ../../shared/rubrics/roots.v1.json
        buildPhase: resources
      - path: ../../shared/schemas/rubric-response.v1.json
        buildPhase: resources
      - path: ../../shared/schemas/grading-result.v1.json
        buildPhase: resources
      - path: ../../tests/benchmarks/roots.json
        buildPhase: resources
      - path: ../../tests/fixtures/question-paper.txt
        buildPhase: resources
      - path: ../../tests/fixtures/answer-key.txt
        buildPhase: resources
    postBuildScripts:
      - name: Embed local Firebase configuration
        path: Scripts/embed-firebase.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gradewise.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GradeWise AI
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1,2
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: GradeWiseRelease.entitlements
  GradeWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
        optional: true
    dependencies:
      - target: GradeWise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.gradewise.ios.tests
  GradeWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
        optional: true
    dependencies:
      - target: GradeWise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.gradewise.ios.uitests
schemes:
  GradeWise:
    build:
      targets:
        GradeWise: all
    test:
      gatherCoverageData: true
      targets:
        - name: GradeWiseTests
        - name: GradeWiseUITests
          parallelizable: false
